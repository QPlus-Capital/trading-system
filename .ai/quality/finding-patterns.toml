# The finding registry required by the constitution (section 14): every confirmed reviewer finding
# is reproduced, generalized, and recorded here so a defect CLASS becomes permanent protection and a
# recurrence is treated as a workflow failure, not just another code bug. Read with stdlib tomllib;
# schema enforced by tests/test_finding_registry.py.
#
# Each [[finding]] records: id, source, defect_class, severity, affected, root_cause,
# why_tests_missed, regression (the test that now guards it), generalized (the rule/property), and
# workflow_change (what skill/hook/check/rule this strengthened, or "none").
version = 1

# ---- The four representative defect classes the workflow is calibrated against ----

[[finding]]
id = "F-001"
source = "characterize/continuous walk-forward"
defect_class = "lifecycle-side-effect"
severity = "P1"
affected = "core/strategies/rsi_wpr_bb.py, research/engine/continuous.py"
root_cause = "engine stop called close_all_positions, so an end-of-span liquidation was booked as a real OOS trade"
why_tests_missed = "the fixture never exercised on_stop; the lifecycle was not traced end to end"
regression = "flatten_on_stop=False path + boundary-close attribution tests"
generalized = "for any engine/runner/context-manager, test whether stop/cleanup changes a domain-visible result"
workflow_change = "constitution section 8 (lifecycle matrix); adversarial-review lifecycle step"

[[finding]]
id = "F-002"
source = "continuous walk-forward"
defect_class = "config-propagation-loss"
severity = "P1"
affected = "research/engine/continuous.py, core/strategies/rsi_wpr_bb.py"
root_cause = "a constant non-default grid value (e.g. rsi_length=21) was lost between selection and execution; execution reverted to the default"
why_tests_missed = "no test compared the value selection scored against the value execution used"
regression = "pinned_params + scoring_params parity tests"
generalized = "every configuration value on a changed path: test omitted, default, constant non-default, and that a validator cannot accept a mode execution silently ignores"
workflow_change = "constitution section 5 (parity); risk model treats selection/execution as one"

[[finding]]
