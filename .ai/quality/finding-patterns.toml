generalized = "before changing a coupled quantity (sizing basis, risk denominator, cost), enumerate EVERY entry point and change them in one pass; a partial change is the dominant multi-round defect"
workflow_change = "CLAUDE.md protocol step 2; risk-classes.md upgrade rationale"

