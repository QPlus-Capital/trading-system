source = "continuous walk-forward"
defect_class = "unclassified-outcome-bucket"
severity = "P1"
affected = "research/engine/continuous.py (window_returns)"
root_cause = "a position closing in a gap between windows (step > test) belonged to no result bucket while its PnL still moved the next window's balance"
