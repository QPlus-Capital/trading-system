[[finding]]
id = "F-004"
source = "research/regression.py"
defect_class = "numeric-boundary"
severity = "P1"
affected = "research/regression.py"
root_cause = "trade-count drift computed as 0% when the reference count was zero, hiding a real zero->nonzero transition"
