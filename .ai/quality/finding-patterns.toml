generalized = "test zero/empty/NaN/inf reference and candidate, and every near-zero denominator; an undefined ratio is a stop, not a pass"
workflow_change = "constitution section 6 (guard every denominator); section 8 (numeric matrix)"

# ---- Confirmed classes from building this workflow ----

[[finding]]
id = "F-005"
source = "PR #57 (constant-basis sizing)"
defect_class = "coupled-quantity-partial-change"
severity = "P1"
affected = "core/strategies/rsi_wpr_bb.py, research/engine/continuous.py, research/portfolio/trades.py, research/engine/characterize.py"
root_cause = "the sizing basis was pinned at one call site (OOS execution) while training sizing, R attribution, margin, and the Stage 1 account basis were left inconsistent"
