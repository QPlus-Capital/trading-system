[finding]
source = "PR #143 review 4823450100 (S-01)"
defect_class = "freshness-window-erases-undismissed-platform-blocker"
severity = "Suspected defect"
affected = "scripts/quality/review_observation.py, tests/test_quality_review_observation.py"
root_cause = "review freshness filtered out earlier commit windows before reviewer state reduction, allowing a later non-blocking review to erase an undismissed CHANGES_REQUESTED state"
why_tests_missed = "state-reduction fixtures kept every review on one commit and therefore never crossed a code-commit freshness boundary"
regression = "test_a_current_review_cannot_clear_an_undismissed_earlier_change_request; test_an_explicitly_dismissed_change_request_no_longer_blocks_a_current_review"
generalized = "use freshness only to prove that current review activity exists; preserve authoritative blocking state across commit windows until the platform explicitly marks it dismissed"
workflow_change = "the observer requires a current non-dismissed review but reduces each reviewer across all pull-request commits, retaining every undismissed change request"
