version = 1

[finding]
source = "PR #143 review 4823450100 (D-01, S-02, S-03)"
defect_class = "self-authored-double-hides-external-contract-break"
severity = "Defect"
affected = "scripts/quality/review_observation.py, scripts/quality/pr_body.py, tests/test_quality_review_observation.py, tests/test_github_templates.py"
root_cause = "external CLI and production call-chain seams were replaced by permissive doubles whose invented payloads and stubs matched the implementation instead of the external interface"
why_tests_missed = "the gh double matched only a command prefix, the rename fixture did not distinguish --no-renames, and the PR-body test stubbed the next production frame"
regression = "test_local_gateway_refuses_a_pull_request_head_mismatch; test_ci_scope_detector_uses_the_real_no_rename_git_diff; test_real_pr_body_validation_forwards_strict_review_observation"
generalized = "a double for an external interface must assert the exact externally specified call and return only producer-valid shapes; every production handoff must also execute once without replacing the next frame"
workflow_change = "the gh argv is one module constant checked exactly, repository identity comes from gh-supported URL output, the rename attack distinguishes the flag, and strict review forwarding runs through real PR-body validation"
