version = 1

[finding]
source = "issue #107 Codex independent review of the workflow contract"
defect_class = "procedural-contract-verified-by-reading-not-by-execution"
severity = "P1"
affected = "docs/engineering/workflow.md, docs/engineering/constitution.md, AGENTS.md, CLAUDE.md"
root_cause = "a governance document that two agents execute literally was checked section by section, so a consumed build permit still gated resumption, a role summary still promised a ready pull request the constitution had replaced with a draft, a review loop had no transition back, and three capabilities the repository lacks were written in the present tense"
why_tests_missed = "the test plan mapped every acceptance criterion to manual sentence inspection, and the existing consistency guards assert that individual phrases are present, which no contradiction between two sections can violate"
regression = "test_workflow_contract_toml_is_valid_and_complete; test_declared_statuses_exactly_match_required_records; test_declared_transitions_exactly_match_required_records; test_every_registered_activation_is_declared; test_workflow_documents_match_the_machine_contract; test_rendering_emits_every_machine_contract_record; test_no_role_document_says_builder_opens_ready_pull_request; test_contract_rendering_rejects_semantic_counterexample; test_every_finding_registry_regression_reference_resolves"
generalized = "a document agents execute is code: declare its state machine as tables, pin every complete status, transition, and activation record outside that contract, assert exact set equality in both directions, add negative assertions against superseded wording in every document that could restate it, and register every capability the contract assumes but the repository does not yet provide"
workflow_change = "governance changes carry executable contract guards; the workflow keeps a Not yet active table whose rows leave only with the change that lands the dependency"
