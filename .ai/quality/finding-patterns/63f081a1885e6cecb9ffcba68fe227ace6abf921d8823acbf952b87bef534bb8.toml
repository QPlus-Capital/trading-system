version = 1

[finding]
source = "PR #130 first ready-state Linux run review"
defect_class = "ci-tool-environment-contaminates-hermetic-subprocess-test"
severity = "Defect"
affected = "tests/test_live_accounts.py, .github/workflows/ci.yml"
root_cause = "the dotenv parser test removed account values from its subprocess environment but retained UV control variables, so the job-level UV_NO_SYNC flag changed the nested uv invocation and emitted a warning"
why_tests_missed = "the old Windows jobs did not export UV_NO_SYNC and the first ready-state Linux run was the first execution under the consolidated job environment"
regression = "UV_NO_SYNC=1 uv run pytest -q tests/test_live_accounts.py::test_documented_env_layout_round_trips_windows_paths_and_telegram_through_uv"
generalized = "a hermetic subprocess test for a tool's parsing behavior must remove that tool's inherited control variables while retaining broad diagnostics that expose silent input loss"
workflow_change = "the clean subprocess environment strips every UV_* variable and the broad no-warning assertion remains unchanged"
