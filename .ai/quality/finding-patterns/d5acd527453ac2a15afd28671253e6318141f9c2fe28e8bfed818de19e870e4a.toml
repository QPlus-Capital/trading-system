version = 1

[finding]
source = "issue #136 from the #114 workflow dry run"
defect_class = "state-bound-permit-survives-transition-and-enables-unreviewed-reentry"
severity = "Defect"
affected = "scripts/quality/board.py, tests/test_quality_board.py"
root_cause = "generic board moves changed status without invalidating the approved build permit, while start validated only the current snapshot and therefore accepted a stale permit after a move back to Ready to Implement"
why_tests_missed = "tests covered approval ordering and build-start failure ordering but never traversed a status cycle, simulated a label removal that did not stick, or required refusal messages to expose every observed mismatch"
regression = "test_start_refuses_after_demoting_an_approved_card; test_no_board_operation_path_reaches_armed_ready_without_arm; test_every_permit_removal_is_verified_by_rereading_state; test_start_refusal_reports_every_observed_failure"
generalized = "a capability granted for one workflow state must be invalidated and verified before any generic transition, and a guard refusal must report every observed mismatch rather than one generic requirement sentence"
workflow_change = "board moves and explicit withdrawal share verified permit removal, the transition graph is exercised against stale permits, and start/approval refusals report only state read from the board"
