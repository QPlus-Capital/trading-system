[finding]
source = "PR #105 fourth independent live-money review"
defect_class = "actionability-filter-hides-unverifiable-account-risk"
severity = "P1"
affected = "live/mt5_bridge.py, live/runner.py, monitoring/dashboard.py"
root_cause = "the bridge safely omitted an undecodable foreign position from the actionable list but exposed no separate evidence that account-wide exposure was incomplete"
why_tests_missed = "the foreign-position regression asserted only no halt and no close; it never drove the same raw record through the 2% account-risk cap or the operator risk display"
regression = "test_foreign_unknown_position_type_blocks_new_risk_without_halting; test_load_live_surfaces_an_undecodable_position_as_unpriceable"
generalized = "filtering a record from an action surface must not filter it from safety accounting; preserve a separate completeness signal and fail closed on any unpriced exposure"
workflow_change = "position snapshots now carry decoded records and per-record issues jointly into the account-risk and monitoring consumers"
