[finding]
source = "PR #140 reviews 4818275329 and 4819183725"
defect_class = "guard-boundaries-and-entrypoint-preconditions-covered-on-only-one-side"
severity = "Suspected defect"
affected = "scripts/quality/board.py, tests/test_quality_board.py"
root_cause = "tests covered multiple risk labels but not zero or lookalike labels, and exercised arm through only one accepted risk class and two refused statuses without proving every precondition and refused approval boundary before writes"
why_tests_missed = "happy-path ordering, one conflict case, and R3-only fixtures were mistaken for complete coverage of cardinality, configuration propagation, validation, and no-write boundaries"
regression = "test_start_refuses_a_card_without_any_risk_label; test_start_guard_condition_set_is_unchanged; test_arm_refuses_unapprovable_input_before_any_write; test_arm_refuses_a_card_outside_ready_without_mutation; test_arm_writes_the_requested_risk_label_for_every_class; test_arm_and_approval_write_refusals_name_observed_status; test_arm_ignores_a_non_contract_risk_lookalike; test_arm_reports_only_contract_risks_when_risk_write_is_lost; test_arm_refuses_conflicting_risk_for_every_requested_class"
generalized = "cardinality guards require zero, one, many, and lookalike cases; configurable values require at least two distinct accepted values; and every public precondition and refusal must prove that no external write occurred"
workflow_change = "the start predicate is exhaustively compared over exact risk labels, arm covers every status and risk class, and invalid arm or approval inputs are proven to leave the permit absent"
