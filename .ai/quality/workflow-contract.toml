version = 1

[gate_rule]
relation = "minimum"
scope = "risk class"
additional_scoped_checks = true

[ready_for_review]
actor = "Codex"
initial_pull_request_state = "draft"
requires_clean_independent_review = true
requires_readiness_check = true
merge_decider = "Jan"

[document_hashes]
workflow = [238, 228, 153, 208, 254, 25, 57, 36, 211, 144, 150, 11, 117, 19, 77, 121, 216, 140, 49, 99, 129, 83, 40, 173, 231, 96, 128, 140, 120, 249, 51, 65]
agents = [129, 240, 72, 85, 122, 168, 132, 172, 227, 147, 49, 118, 23, 89, 120, 12, 242, 93, 54, 53, 171, 77, 16, 138, 128, 134, 14, 40, 110, 11, 7, 132]
claude = [234, 109, 63, 241, 43, 25, 219, 99, 198, 206, 0, 141, 179, 55, 27, 97, 0, 141, 255, 90, 73, 131, 101, 127, 158, 85, 248, 255, 73, 230, 59, 204]
constitution = [16, 70, 177, 53, 126, 241, 160, 178, 132, 215, 175, 8, 120, 157, 127, 203, 78, 16, 177, 131, 143, 242, 128, 224, 164, 207, 245, 181, 140, 97, 160, 123]

[[status]]
name = "Backlog"
meaning = "A raw idea. One sentence is enough."
actor = "Project automation (auto-add)"

[[status]]
name = "Specifying"
meaning = "Claude is working the idea into a specification with Jan."
actor = "Claude"

[[status]]
name = "Ready to Implement"
meaning = "Approved by Jan. Codex **may** build it — not \"build it now\"."
actor = "Claude, after Jan's explicit approval"

[[status]]
name = "Implementing"
meaning = "Codex is building."
actor = "Codex"

[[status]]
name = "Reviewing"
meaning = "The change is with the independent reviewer on the draft pull request."
actor = "Codex, at handover"

[[status]]
name = "Blocked"
meaning = "Waiting on a decision only Jan can make (constitution §13)."
actor = "Any agent"

[[status]]
name = "Done"
meaning = "Merged."
actor = "Project automation (item closed)"

[[builder_guard]]
name = "Start"
condition = "card in `Ready to Implement`, `approved` present, `risk:Rn` present"
action = "move the card to `Implementing`, **then** remove `approved`"

[[builder_guard]]
name = "Resume"
condition = "the card is in `Implementing` or `Reviewing`, **and** a branch exists in this repository whose name is `codex/<issue>-…` or `claude/<issue>-…` for **this** issue number"
action = "continue on it **without** a permit — the first start already consumed it"

[[approval_step]]
order = 1
action = "write the final issue body"

[[approval_step]]
order = 2
action = "add risk:Rn"

[[approval_step]]
order = 3
action = "move the card to Ready to Implement"

[[approval_step]]
order = 4
action = "add approved"
approved_written_last = true

[[transition]]
source = "-"
target = "Backlog"
actor = "project automation"
trigger = "an issue is opened"

[[transition]]
source = "Backlog"
target = "Specifying"
actor = "Claude"
trigger = "Jan asks for the idea to be worked out"

[[transition]]
source = "Blocked"
target = "Specifying"
actor = "Claude"
trigger = "Jan decided"

[[transition]]
source = "Specifying"
target = "Backlog"
actor = "Claude"
trigger = "Jan defers the idea; the specification is kept"

[[transition]]
source = "Specifying"
target = "Ready to Implement"
actor = "Claude"
trigger = "Jan approves; `approved` is written last"

[[transition]]
source = "Ready to Implement"
target = "Specifying"
actor = "Claude"
trigger = "an approved issue must change; `approved` is removed first"

[[transition]]
source = "Ready to Implement"
target = "Implementing"
actor = "Codex"
trigger = "build starts; `approved` is removed afterwards"

[[transition]]
source = "Implementing"
target = "Reviewing"
actor = "Codex"
trigger = "the draft pull request is opened and handed over for review"

[[transition]]
source = "Reviewing"
target = "Implementing"
actor = "Claude"
trigger = "a blocking finding"

[[transition]]
source = "Implementing"
target = "Reviewing"
actor = "Codex"
trigger = "the review fix is pushed"

[[transition]]
source = "Implementing"
target = "Specifying"
actor = "Codex"
trigger = "the specification is wrong, incomplete or unbuildable"

[[transition]]
source = "Specifying"
target = "Blocked"
actor = "Claude"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Ready to Implement"
target = "Blocked"
actor = "any agent"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Implementing"
target = "Blocked"
actor = "any agent"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Reviewing"
target = "Blocked"
actor = "any agent"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Reviewing"
target = "Done"
actor = "project automation"
trigger = "the pull request merged and closed the issue"
