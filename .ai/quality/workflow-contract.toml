version = 1

[gate_rule]
relation = "minimum"
scope = "risk class"
additional_scoped_checks = true

[ready_for_review]
actor = "Codex"
initial_pull_request_state = "draft"
requires_clean_independent_review = true
requires_readiness_check = true
merge_decider = "Jan"

[transitional_review]
activation_issue = 124
blocked_action = "pull_request_creation"
review_surface = "pushed_branch"
pull_request_timing = "after_review"

[document_hashes]
workflow = [174, 222, 186, 196, 184, 81, 53, 2, 106, 182, 216, 22, 180, 43, 141, 44, 85, 52, 31, 86, 243, 106, 213, 190, 231, 217, 170, 136, 102, 144, 202, 167]
agents = [250, 136, 112, 59, 183, 24, 109, 39, 138, 248, 54, 99, 68, 163, 143, 46, 124, 61, 186, 63, 174, 9, 49, 190, 165, 97, 214, 160, 135, 9, 103, 2]
claude = [239, 11, 42, 72, 30, 32, 77, 52, 71, 153, 168, 50, 48, 136, 253, 252, 46, 234, 202, 126, 196, 180, 235, 39, 202, 230, 161, 234, 244, 206, 220, 241]
constitution = [6, 122, 239, 227, 203, 150, 225, 90, 82, 170, 15, 227, 59, 63, 97, 189, 9, 90, 193, 38, 165, 24, 5, 1, 80, 126, 92, 200, 16, 65, 50, 85]

[[status]]
name = "Backlog"
meaning = "A raw idea. One sentence is enough."
actor = "Project automation (auto-add)"

[[status]]
name = "Specifying"
meaning = "Claude is working the idea into a specification with Jan."
actor = "Claude"

[[status]]
name = "Ready to Implement"
meaning = "Approved by Jan. Codex **may** build it — not \"build it now\"."
actor = "Claude, after Jan's explicit approval"

[[status]]
name = "Implementing"
meaning = "Codex is building."
actor = "Codex"

[[status]]
name = "Reviewing"
meaning = "The change is with the independent reviewer — on the draft pull request, or on the pushed branch while the branch-review rule below applies."
actor = "Codex, at handover"

[[status]]
name = "Blocked"
meaning = "Waiting on a decision only Jan can make (constitution §13)."
actor = "Any agent"

[[status]]
name = "Done"
meaning = "Merged."
actor = "Project automation (item closed)"

[[builder_guard]]
name = "Start"
condition = "card in `Ready to Implement`, `approved` present, `risk:Rn` present"
action = "move the card to `Implementing`, **then** remove `approved`"

[[builder_guard]]
name = "Resume"
condition = "the card is in `Implementing` or `Reviewing`, **and** a branch exists in this repository whose name is `codex/<issue>-…` or `claude/<issue>-…` for **this** issue number"
action = "continue on it **without** a permit — the first start already consumed it"

[[approval_step]]
order = 1
action = "write the final issue body"

[[approval_step]]
order = 2
action = "add risk:Rn"

[[approval_step]]
order = 3
action = "move the card to Ready to Implement"

[[approval_step]]
order = 4
action = "add approved"
approved_written_last = true

[[transition]]
source = "-"
target = "Backlog"
actor = "project automation"
trigger = "an issue is opened"

[[transition]]
source = "Backlog"
target = "Specifying"
actor = "Claude"
trigger = "Jan asks for the idea to be worked out"

[[transition]]
source = "Blocked"
target = "Specifying"
actor = "Claude"
trigger = "Jan decided"

[[transition]]
source = "Specifying"
target = "Backlog"
actor = "Claude"
trigger = "Jan defers the idea; the specification is kept"

[[transition]]
source = "Specifying"
target = "Ready to Implement"
actor = "Claude"
trigger = "Jan approves; `approved` is written last"

[[transition]]
source = "Ready to Implement"
target = "Specifying"
actor = "Claude"
trigger = "an approved issue must change; `approved` is removed first"

[[transition]]
source = "Ready to Implement"
target = "Implementing"
actor = "Codex"
trigger = "build starts; `approved` is removed afterwards"

[[transition]]
source = "Implementing"
target = "Reviewing"
actor = "Codex"
trigger = "the change is handed over for review — by opening the draft pull request, or, while the branch-review rule below applies, by pushing the branch and saying so"

[[transition]]
source = "Reviewing"
target = "Implementing"
actor = "Claude"
trigger = "a blocking finding"

[[transition]]
source = "Implementing"
target = "Reviewing"
actor = "Codex"
trigger = "the review fix is pushed"

[[transition]]
source = "Implementing"
target = "Specifying"
actor = "Codex"
trigger = "the specification is wrong, incomplete or unbuildable"

[[transition]]
source = "Specifying"
target = "Blocked"
actor = "Claude"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Ready to Implement"
target = "Blocked"
actor = "any agent"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Implementing"
target = "Blocked"
actor = "any agent"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Reviewing"
target = "Blocked"
actor = "any agent"
trigger = "a decision only Jan can make is open"

[[transition]]
source = "Reviewing"
target = "Done"
actor = "project automation"
trigger = "the pull request merged and closed the issue"

[[activation]]
capability = "The draft pull request carries the review"
issue = 124
fallback = "The pre-Bash hook blocks `gh pr create` until the readiness check passes, so the independent review runs on the **pushed branch** and the pull request is opened afterwards. Constitution §11 states this transitional rule itself, so it is not a lower document overriding a higher one."

[[activation]]
capability = "Artifact files scale by risk class"
issue = 124
fallback = "`task-artifacts.toml` requires all five files for every class, `spec.md` included. Write them."

[[activation]]
capability = "Board transitions performed by tooling"
issue = 110
fallback = "Agents call `gh` directly and are responsible for the ordering rules themselves."

[[activation]]
capability = "The `methodology-reviewer` subagent"
issue = 112
fallback = "The general code reviewer carries the constitution §4 methodology invariants, as it does today."

[[activation]]
capability = "Findings named `Blocker` / `Defect` / `Suspected defect` / `Note`"
issue = 112
fallback = "Severities are `P0`–`P3`, as the constitution §12 states."
