# Focused mutation policy. The Python orchestrator reads this with stdlib tomllib and delegates
# R3 classification and changed-path discovery to scripts/quality/classify.py.
version = 1

[tool]
name = "mutmut"
version = "3.5.0"
execution_platform = "linux"
python = "3.13"

[[targets]]
id = "live-risk-control"
path = "live/risk_control.py"
mutant_patterns = [
    "live.risk_control.x_position_volume__mutmut_*",
    "live.risk_control.x*RiskController*check_open__mutmut_*",
    "live.risk_control.x*RiskController*must_flatten__mutmut_*",
    "live.risk_control.x*RiskController*trailing_floor__mutmut_*",
    "live.risk_control.x*RiskController*daily_floor__mutmut_*",
    "live.risk_control.x*RiskController*gate_daily_floor__mutmut_*",
    "live.risk_control.x*RiskController*prop_daily_floor__mutmut_*",
]

[[targets]]
id = "portfolio-h4-prices"
path = "research/portfolio/curves.py"
mutant_patterns = [
    "research.portfolio.curves.x_interval_loss_days__mutmut_*",
    "research.portfolio.curves.x_load_h4_prices__mutmut_*",
]

