# Machine-readable change-risk model. Read with stdlib `tomllib` by the risk classifier (added in
# the tooling PR) and by CI — no third-party dependency. Path matching is a CONSERVATIVE MINIMUM:
# the classifier takes the highest class over all matched rules, and the author MUST upgrade when
# semantic impact is broader than the paths suggest. It must never DOWNGRADE below the matched
# minimum.
#
# Prose companion: docs/engineering/risk-classes.md. Constitution: docs/engineering/constitution.md.
version = 1

# SAFE BY DEFAULT. This repository is almost entirely on the money / methodology / result path, so
# the model does NOT enumerate R3 and let the rest fall low -- it defaults high and downgrades only
# clearly-safe things. An unmatched path is R2 (it still gets adversarial review); R0/R1 are reached
# only by an explicit rule or the docs-only fallback below.
default_min_class = "R2"

# Classification of a single path:
#   1. if it matches any rule -> the HIGHEST class among the matched rules (explicit rules always
#      win, so a governance .md matches its R3 rule rather than the docs-only fallback);
#   2. else if it matches a docs-only glob -> R0 (a plain, non-governance doc);
#   3. else -> default_min_class.
# Governance and methodology documents are NOT docs-only: they have explicit R3 rules below.
docs_only_globs = ["*.md", "**/*.md", "docs/**", "LICENSE"]

[classes.R0]
name = "Documentation or comments only"
description = "No behaviour change. Docs, comments, markdown."
gates = ["format", "docs-consistency"]

[classes.R1]
name = "Local non-financial implementation"
description = "Code with no financial, methodology, or result-integrity impact (tooling, scripts)."
gates = ["check", "impacted-tests"]

[classes.R2]
name = "Shared core / research orchestration / artifact schema / config / monitoring semantics"
description = "Widely depended on, but not on the money or methodology path."
gates = ["check", "property-tests-where-applicable", "integration-tests", "artifact-schema", "adversarial-review"]

[classes.R3]
name = "Live-money / sizing / risk / methodology / result integrity"
description = "Live-money path, sizing, risk control, account identity, orders, signal parity, broker conversion, money calculations, methodology, holdout, selection, or result integrity."
gates = ["check", "invariants", "mutation-on-touched-critical", "parity-where-applicable", "adversarial-review", "live-money-review", "human-decision-escalation", "no-autonomous-merge"]

# Ordered rules; the classifier takes the MAX class over all matched rules and records the reason of
# the highest match. Most-specific R3 paths first for clear reasons.

# ---- R3: the live-money path ----
[[rules]]
glob = "live/risk_control.py"
min_class = "R3"
reason = "internal risk limits must stay stricter than the prop firm's"

[[rules]]
glob = "live/runner.py"
min_class = "R3"
reason = "live order placement and position sizing"

[[rules]]
glob = "live/accounts.py"
min_class = "R3"
reason = "account identity guard"

[[rules]]
glob = "live/mt5_bridge.py"
min_class = "R3"
reason = "broker bridge — orders, fills, money legs"

[[rules]]
glob = "live/preflight.py"
min_class = "R3"
reason = "go/no-go safety pre-flight for the live account"

[[rules]]
glob = "live/config/**"
min_class = "R3"
reason = "configuration promoted to live"

# Catch-all so no live file can fall through to a lower class. The specific rules above give better
# reasons; this guarantees signal-parity checks and any future live file are at least R3.
[[rules]]
glob = "live/**"
min_class = "R3"
reason = "the live trading package"

