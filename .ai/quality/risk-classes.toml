# Catch-alls so no engine or portfolio file can fall to the R2 fallback below. The whole research
# engine (config loader, grid, overfitting, schedule builder, recipe, montecarlo, ...) and the whole
# portfolio (curves, factsheet, ...) compute selection, methodology, money, or reported results.
[[rules]]
glob = "research/engine/**"
min_class = "R3"
reason = "selection, parameter search, and the config loader that live shares"

[[rules]]
glob = "research/portfolio/**"
min_class = "R3"
reason = "equity, swap, holdout and reported-result computation"

# The quality model and the finding registry themselves: a change here could weaken an R3 rule or
# remove no-autonomous-merge, so it must not be able to reach main without the R3 gates.
[[rules]]
glob = ".ai/quality/**"
min_class = "R3"
reason = "the risk model and finding registry govern every other change"

# ---- R3: data ingestion (result integrity) ----
[[rules]]
glob = "core/data/**"
min_class = "R3"
reason = "reconstructs bid/ask, timestamps, spreads and bars -- a parser change alters every result"

# ---- R3: the pinned engine and broker (fills, numeric behaviour) ----
[[rules]]
glob = "pyproject.toml"
min_class = "R3"
reason = "selects the NautilusTrader engine and MetaTrader bridge versions"

[[rules]]
glob = "uv.lock"
min_class = "R3"
reason = "pins every dependency version that produces the numbers"

# ---- R3: the quality gates themselves ----
[[rules]]
glob = "justfile"
min_class = "R3"
reason = "defines the gate commands; disabling one weakens every other change's checks"

[[rules]]
glob = ".github/workflows/**"
min_class = "R3"
reason = "runs the gates in CI; a change here can stop enforcing them"

# ---- R3: governance and methodology documents ----
# These define the quality policy, the holdout rules and the trading methodology, so a change to
# them must not slip through the docs-only R0 shortcut.
[[rules]]
glob = "docs/engineering/**"
min_class = "R3"
reason = "the constitution and risk model -- the governance itself"

[[rules]]
glob = "docs/methodology.md"
min_class = "R3"
reason = "the trading methodology and holdout discipline"

[[rules]]
glob = "CLAUDE.md"
min_class = "R3"
reason = "the builder contract and immutable constraints"

[[rules]]
glob = "AGENTS.md"
min_class = "R3"
reason = "the independent-review contract"

[[rules]]
glob = "docs/live-runbook.md"
min_class = "R3"
reason = "real-account execution and risk-state reset instructions"

[[rules]]
glob = "docs/strategies/**"
min_class = "R3"
reason = "the pre-registered trial universe and DSR denominator -- methodology integrity"

# ---- R2: shared core, orchestration, artifacts, monitoring ----
[[rules]]
glob = "core/data/**"
min_class = "R2"
reason = "catalog and data ingestion — artifact schema and drift"

[[rules]]
glob = "core/**"
min_class = "R2"
reason = "shared core"

[[rules]]
glob = "research/**"
min_class = "R2"
reason = "research orchestration and reporting"

[[rules]]
glob = "monitoring/**"
min_class = "R2"
reason = "live-vs-backtest monitoring semantics"

[[rules]]
glob = ".github/workflows/**"
min_class = "R2"
reason = "CI is a quality gate"

# ---- R1: tests and tooling ----
# Tests are the guards. A "test-only" change can delete a money-path check, so it is R2 (adversarial
# review sees it), not R1.
[[rules]]
glob = "tests/**"
min_class = "R2"
reason = "the guards themselves -- a deleted check must be reviewed"

[[rules]]
glob = "scripts/**"
min_class = "R1"
reason = "repository tooling with no gate role"
