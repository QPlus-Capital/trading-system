name: Critical mutation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Install locked dependencies except the Windows-only MT5 bridge
        run: uv sync --locked --no-install-package metatrader5
      - name: Prove a real weakened test creates a caught survivor
        run: uvx --from rust-just just mutation-self-test
      - name: Run the focused critical mutation ratchet
        run: uvx --from rust-just just mutation-critical
      - name: Retain the machine-readable mutation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-critical-result
          path: .ai/mutation/critical.toml
          if-no-files-found: error
          include-hidden-files: true
