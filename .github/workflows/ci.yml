name: CI

# The gates run locally before every push (`just gates`). CI is the independent confirmation that
# green was not merely green on one machine. It therefore runs once per pull request, on Linux,
# with the expensive platform-specific jobs conditional on the paths that actually need them.
#
# `required-checks` is the only context branch protection should require. GitHub counts a SKIPPED
# required check as satisfied, so a conditional job must never be required directly -- that is
# fail-open on the protection guarding `main`. This job always runs and fails if any needed job
# failed, whatever the conditions decided.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The deliberate re-run: after a force-push the green results belong to commits that no longer
  # exist, and an infrastructure failure is not a code failure. Without this, the only way to get a
  # fresh run was closing and reopening the pull request. `scope=mutation-affected` is how the
  # review cycle produces the one mutation measurement per ticket, on the head it certifies.
  workflow_dispatch:
    inputs:
      scope:
        description: everything, or only the mutation ratchet on the targets this diff reaches
        type: choice
        options: [everything, mutation-affected]
        default: everything
  # The weekly full mutation run on main catches what the per-ticket affected scope cannot see:
  # drift in targets no recent change reached.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `metatrader5` has no Linux wheel, so any `uv run` that re-resolves the environment fails
      # here. The sync step below installs everything except that package; this keeps every later
      # `uv run` on the environment it produced. Removing the marker is issue #150.
      UV_NO_SYNC: "1"
    outputs:
      needs_mt5: ${{ steps.scope.outputs.needs_mt5 }}
      needs_mutation: ${{ steps.scope.outputs.needs_mutation }}
      mutation_scope: ${{ steps.scope.outputs.mutation_scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies except the Windows-only MT5 bridge
        run: uv sync --locked --no-install-package metatrader5

      - name: Decide which conditional jobs this change needs
        id: scope
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'everything' }}
        shell: bash
        run: |
          uv run python - <<'PY'
          import os

          from workflow.classify import changed_paths

          event = os.environ["EVENT_NAME"]
          if event == "schedule":
              # The weekly full measurement on main: the complete critical ratchet plus the
              # Windows boundary job, so drift in unreached targets and the MT5 seam both surface.
              needs_mutation, mutation_scope, needs_mt5 = True, "critical", True
          elif event == "workflow_dispatch" and os.environ["DISPATCH_SCOPE"] == "mutation-affected":
              # The review cycle's one measurement per ticket: only the targets the branch diff
              # can reach, selected by the same policy code the local gate uses.
              needs_mutation, mutation_scope, needs_mt5 = True, "affected", False
          elif event == "workflow_dispatch":
              # A dispatch is a deliberate act: run everything. This is also the only way a NEW
              # mutation target can be measured for the first time — the affected scope cannot
              # select a target whose module the change did not touch.
              needs_mutation, mutation_scope, needs_mt5 = True, "critical", True
          else:
              # A push measures no mutants. Mutation evidence is produced once per ticket by the
              # review cycle, on the head it certifies — not on every intermediate push.
              paths = changed_paths(f"origin/{os.environ['BASE_REF']}")
              needs_mutation, mutation_scope = False, ""
              needs_mt5 = any(
                  path.startswith("live/mt5_bridge") or path.startswith("live/preflight")
                  or path == "tests/conftest.py"
                  or path.startswith("tests/test_live_mt5_bridge")
                  or path.startswith("tests/test_workflow_test_boundaries")
                  for path in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_mutation={str(needs_mutation).lower()}\n")
              output.write(f"mutation_scope={mutation_scope}\n")
              output.write(f"needs_mt5={str(needs_mt5).lower()}\n")
          PY

      - name: "Gate: check"
        timeout-minutes: 30
        run: uvx --from rust-just just check
      - name: "Gate: properties"
        timeout-minutes: 20
        run: uvx --from rust-just just check-properties
      - name: "Gate: security"
        timeout-minutes: 20
        run: uvx --from rust-just just check-security
      - name: "Gate: invariants"
        timeout-minutes: 20
        run: uvx --from rust-just just check-invariants
      - name: "Gate: parity"
        timeout-minutes: 20
        run: uvx --from rust-just just check-parity

  mt5-boundary:
    needs: quality
    if: needs.quality.outputs.needs_mt5 == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies including the Windows-only MT5 bridge
        run: uv sync --locked
      - name: Prove pytest cannot reach a real broker
        run: uv run pytest -q tests/test_workflow_test_boundaries.py

  mutation:
    needs: quality
    if: needs.quality.outputs.needs_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies except the Windows-only MT5 bridge
        run: uv sync --locked --no-install-package metatrader5
      - name: Prove a real weakened test creates a caught survivor
        if: needs.quality.outputs.mutation_scope == 'critical'
        run: uvx --from rust-just just mutation-self-test
      - name: Run the focused critical mutation ratchet
        if: needs.quality.outputs.mutation_scope == 'critical'
        run: uvx --from rust-just just mutation-critical
      - name: Run the mutation ratchet on the targets this diff reaches
        if: needs.quality.outputs.mutation_scope == 'affected'
        run: uvx --from rust-just just mutation-affected
      - name: Retain the machine-readable mutation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-result
          path: workflow/mutation-results/
          if-no-files-found: error
          include-hidden-files: true

  required-checks:
    needs: [quality, mt5-boundary, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          bad = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] not in {"success", "skipped"}
          }
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if bad:
              print(f"\nFAILED: {bad}")
              sys.exit(1)
          print("\nAll required jobs passed or were legitimately skipped.")
          PY
