name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies including the Windows-only MT5 bridge
        run: uv sync --locked
      - name: "Gate: Standard Quality"
        timeout-minutes: 20
        run: uvx --from rust-just just check-standard
      - name: Run the real-MT5 pytest boundary self-test
        if: github.event.pull_request.draft == false
        timeout-minutes: 30
        run: uv run pytest -q tests/test_workflow_system_validation.py::test_pytest_blocks_real_mt5_boundaries

  full-quality:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies except the Windows-only MT5 bridge
        run: uv sync --locked --no-install-package metatrader5
      - name: "Gate: Tests"
        timeout-minutes: 30
        run: uvx --from rust-just just check-tests
      - name: "Gate: Deterministic Property Replay"
        timeout-minutes: 30
        run: uvx --from rust-just just check-properties
      - name: "Gate: Task-Artifact Validation"
        timeout-minutes: 10
        run: uvx --from rust-just just check-task-artifact
      - name: "Gate: Security"
        timeout-minutes: 20
        run: uvx --from rust-just just check-security
      - name: "Gate: Critical Invariants"
        timeout-minutes: 20
        run: uvx --from rust-just just check-invariants
      - name: "Gate: PR-Evidence Validation"
        timeout-minutes: 10
        run: uvx --from rust-just just check-pr-evidence
