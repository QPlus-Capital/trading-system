[[finding]]
id = "F-042"
source = "PR #105 complete independent re-review"
defect_class = "broad-bridge-exception-triggers-unconditional-liquidation"
severity = "P1"
affected = "live/runner.py, live/mt5_bridge.py"
root_cause = "the runner used the bridge's general Mt5Error to distinguish an ambiguous position side from routine terminal read failures, so one transient symbol or position read liquidated a healthy book and permanently halted the session"
why_tests_missed = "the only runner-consumer test used signal-only mode with no open positions, making both the no-close assertion and the single alert vacuous; no test injected a transient read followed by a healthy safety cycle"
regression = "test_transient_symbol_info_failure_does_not_halt_or_flatten; test_transient_positions_read_failure_does_not_halt_or_flatten; test_healthy_cycle_after_transient_read_still_evaluates_must_flatten"
generalized = "a destructive safety action must catch a dedicated semantic failure, never a transport exception shared with retryable reads; test permanent and transient faults with a non-empty executable book"
workflow_change = "the side converter raises a dedicated Mt5SideError subtype and the safety consumer catches only that subtype; runner mutation coverage pins both liquidation and retry boundaries"

[[finding]]
