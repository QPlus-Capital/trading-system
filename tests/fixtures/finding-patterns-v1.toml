[[finding]]
id = "F-041"
source = "PR #105 independent live-money review after mutation remediation"
defect_class = "external-runtime-representation-or-read-failure-disables-safety-cycle"
severity = "P2"
affected = "live/mt5_bridge.py, live/runner.py"
