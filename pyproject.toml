[project]
name = "qplus-trading-system"
version = "0.1.0"
description = "QPlus Capital quantitative trading system built on NautilusTrader (backtesting and live trading)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    # Event-driven backtesting/live engine. Pinned via uv.lock and installed by
    # `uv sync`. Requires a platform with a wheel (Apple Silicon macOS or Linux);
    # Intel macOS (x86_64) is unsupported.
    "metatrader5>=5.0.5735",
    "nautilus-trader>=1.230.0",
    "streamlit>=1.59.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "hypothesis>=6.158.1",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout, one package per world plus the shared core (no src/qplus nesting).
packages = ["core", "research", "live", "monitoring"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["core", "research", "live", "monitoring", "tests", "scripts"]

[tool.ruff.lint]
# A pragmatic, strict-ish default set: pyflakes, pycodestyle, isort,
# pyupgrade, bugbear, comprehensions, simplify.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# html_report renders an inline HTML/CSS template -- long content lines are inherent.
"research/portfolio/html_report.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["core", "research", "live", "monitoring", "tests", "scripts"]
strict = true
# NautilusTrader is added later and ships partial type info; don't fail on it.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Repo root on sys.path so the dev tooling under scripts/ is importable in tests without shipping
# it in the wheel (it is not a runtime dependency of the trading system).
pythonpath = ["."]

[tool.mutmut]
# Mutmut needs import-complete package copies; execution remains bounded by mutation.toml patterns.
paths_to_mutate = [
    "live/accounts.py",
    "live/notify.py",
    "live/preflight.py",
    "live/risk_control.py",
    "live/mt5_bridge.py",
    "live/runner.py",
    "monitoring/deals.py",
    "monitoring/dashboard.py",
    "research/portfolio/curves.py",
    "research/portfolio/sizing.py",
    "research/portfolio/drawdown.py",
    "research/portfolio/risk.py",
    "research/portfolio/stats.py",
    "research/portfolio/trades.py",
    "research/portfolio/resample.py",
    "research/portfolio/scenarios.py",
    "research/portfolio/path_risk.py",
    "core/strategies/param_schedule.py",
    "research/engine/continuous.py",
    "research/engine/spa.py",
    "research/engine/romano_wolf.py",
    "research/engine/mcs.py",
    "research/engine/characterize.py",
    "research/stages/select.py",
    "research/regression.py",
    "research/forward_test_registry.py",
    "research/forward_decision.py",
]
also_copy = [
    "core",
    "research",
    "live",
    "monitoring",
    "scripts",
    ".ai",
    "docs",
    ".env.example",
    "RUN.md",
    "justfile",
]
mutate_only_covered_lines = false
pytest_add_cli_args = ["--disable-warnings"]
pytest_add_cli_args_test_selection = [
    "tests/test_live_accounts.py",
    "tests/test_live_notify.py",
    "tests/test_live_run_cli.py",
    "tests/test_live_parity_check.py",
    "tests/test_live_risk_control.py",
    "tests/test_live_mt5_bridge.py",
    "tests/test_live_runner.py",
    "tests/test_live_runner_cycle.py",
    "tests/test_monitoring_dashboard.py",
    "tests/test_monitoring_deals.py",
    "tests/test_monitoring_risk_view.py",
    "tests/test_research_h4_path.py",
    "tests/test_research_sizing.py",
    "tests/test_research_portfolio_dd.py",
    "tests/test_research_risk.py",
    "tests/test_research_stats.py",
    "tests/test_research_swap_analysis.py",
    "tests/test_research_portfolio_trades.py",
    "tests/test_research_resample.py",
    "tests/test_research_resample_properties.py",
    "tests/test_research_scenarios.py",
    "tests/test_research_path_risk.py",
    "tests/test_research_param_schedule.py",
    "tests/test_research_continuous_windows.py",
    "tests/test_research_spa.py",
    "tests/test_research_romano_wolf.py",
    "tests/test_research_mcs.py",
    "tests/test_research_selection_protocol.py",
    "tests/test_research_stage_lineage.py",
    "tests/test_research_regression.py",
    "tests/test_research_forward_test_registry.py",
    "tests/test_research_forward_decision.py",
    "tests/test_research_forward_decision_power.py",
    "tests/test_quality_properties.py",
]
